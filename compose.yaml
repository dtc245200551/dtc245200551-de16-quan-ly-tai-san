name: de16hai
x-log: &log
  driver: json-file
  options: {max-size: "5m", max-file: "3"}
x-env: &env
  NODE_ENV: production
  PORT: "3000"
  DB_HOST: postgres
  DB_NAME: assets
  DB_USER: asset_app
  DB_PASSWORD_FILE: /run/secrets/db_app_password
  SESSION_SECRET_FILE: /run/secrets/session_secret
  TZ: Asia/Ho_Chi_Minh
services:
  storage-init:
    image: alpine:3.23.3
    user: "0:0"
    command: [sh, -ec, "mkdir -p /logs/app /logs/nginx; chown 1000:1000 /logs/app; chown 101:101 /logs/nginx; chmod 755 /logs/app /logs/nginx"]
    network_mode: none
    volumes: [app_logs:/logs/app, nginx_logs:/logs/nginx]
    cap_drop: [ALL]
    cap_add: [CHOWN, FOWNER]
    security_opt: [no-new-privileges:true]
    logging: *log
  postgres:
    image: postgres:17.11-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_USER: asset_owner
      POSTGRES_DB: assets
      POSTGRES_PASSWORD_FILE: /run/secrets/db_owner_password
      TZ: Asia/Ho_Chi_Minh
    secrets: [db_owner_password, db_app_password, db_migrate_password, db_exporter_password]
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init.sh:/docker-entrypoint-initdb.d/10-roles.sh:ro
    networks: [database]
    healthcheck:
      test: [CMD-SHELL, "PGPASSWORD=$$(cat /run/secrets/db_app_password) psql -h 127.0.0.1 -U asset_app -d assets -c 'SELECT 1' >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
    security_opt: [no-new-privileges:true]
    mem_limit: 512m
    logging: *log
  migrate:
    image: de16hai-app:1.0.0
    command: [node, src/migrate.js]
    environment:
      <<: *env
      DB_USER: asset_migrate
      DB_PASSWORD_FILE: /run/secrets/db_migrate_password
      ADMIN_PASSWORD_FILE: /run/secrets/admin_password
    secrets: [db_migrate_password, admin_password]
    depends_on:
      postgres: {condition: service_healthy}
    networks: [database]
    user: "1000:1000"
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    logging: *log
  app:
    build: ./app
    image: de16hai-app:1.0.0
    restart: unless-stopped
    environment: *env
    secrets: [db_app_password, session_secret]
    depends_on:
      migrate: {condition: service_completed_successfully}
      storage-init: {condition: service_completed_successfully}
    volumes: [app_logs:/var/log/app]
    networks: [frontend, database, monitoring]
    user: "1000:1000"
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000/readyz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
    mem_limit: 256m
    logging: *log
  nginx:
    image: nginxinc/nginx-unprivileged:1.28.2-alpine
    restart: unless-stopped
    user: "101:101"
    ports: ["127.0.0.1:${WEB_PORT:-8086}:8080"]
    volumes:
      - ./infra/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - nginx_logs:/var/log/nginx
    networks: [frontend, monitoring, edge]
    depends_on:
      app: {condition: service_healthy}
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: [CMD-SHELL, "wget -qO- http://127.0.0.1:8080/healthz >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 6
    mem_limit: 128m
    logging: *log
  pgadmin:
    image: dpage/pgadmin4:9.15
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@hai.edu.vn
      PGADMIN_DEFAULT_PASSWORD_FILE: /run/secrets/pgadmin_password
      PGADMIN_CONFIG_SERVER_MODE: "True"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
    ports: ["127.0.0.1:${PGADMIN_PORT:-8087}:80"]
    secrets: [pgadmin_password]
    volumes:
      - pgadmin_data:/var/lib/pgadmin
      - ./infra/pgadmin/servers.json:/pgadmin4/servers.json:ro
    networks: [database, tools]
    depends_on:
      postgres: {condition: service_healthy}
    security_opt: [no-new-privileges:true]
    mem_limit: 384m
    logging: *log
networks:
  frontend: {internal: true}
  database: {internal: true}
  monitoring: {internal: true}
  edge: {}
  tools: {}
volumes:
  postgres_data: {}
  pgadmin_data: {}
  app_logs: {}
  nginx_logs: {}
secrets:
  db_owner_password: {file: ./.local/secrets/db_owner_password}
  db_app_password: {file: ./.local/secrets/db_app_password}
  db_migrate_password: {file: ./.local/secrets/db_migrate_password}
  db_exporter_password: {file: ./.local/secrets/db_exporter_password}
  admin_password: {file: ./.local/secrets/admin_password}
  pgadmin_password: {file: ./.local/secrets/pgadmin_password}
  session_secret: {file: ./.local/secrets/session_secret}
