server:
  http_listen_port: 9080
  grpc_listen_port: 0
positions:
  filename: /var/lib/promtail/positions.yml
clients:
  - url: http://loki:3100/loki/api/v1/push
scrape_configs:
  - job_name: hai-app
    static_configs:
      - targets: [localhost]
        labels: {job: app, project: de16hai, service: app, __path__: /var/log/app/*.log}
    pipeline_stages:
      - json:
          expressions: {time: time, level: level}
      - timestamp: {source: time, format: RFC3339Nano}
      - labels: {level: null}
  - job_name: hai-nginx
    static_configs:
      - targets: [localhost]
        labels: {job: nginx, project: de16hai, service: nginx, __path__: /var/log/nginx/access.log}
    pipeline_stages:
      - json:
          expressions: {time: time}
      - timestamp: {source: time, format: RFC3339}
  - job_name: hai-nginx-error
    static_configs:
      - targets: [localhost]
        labels: {job: nginx-error, project: de16hai, service: nginx, __path__: /var/log/nginx/error.log}
  - job_name: hai-postgres
    static_configs:
      - targets: [localhost]
        labels: {job: postgres, project: de16hai, service: postgres, __path__: /var/log/postgresql/*.json}
    pipeline_stages:
      - json:
          expressions: {level: error_severity}
      - labels: {level: null}
