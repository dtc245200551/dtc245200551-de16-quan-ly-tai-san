log_format asset_json escape=json '{"time":"$time_iso8601","method":"$request_method","path":"$uri","status":$status,"duration":$request_time,"request_id":"$upstream_http_x_request_id"}';
access_log /var/log/nginx/access.log asset_json;
error_log /var/log/nginx/error.log warn;
server {
  listen 8080;
  server_name localhost;
  server_tokens off;
  client_max_body_size 32k;
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy same-origin always;
  add_header Content-Security-Policy "default-src 'self'; style-src 'self'; img-src 'self' data:; script-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  location = /metrics { return 404; }
  location = /readyz { return 404; }
  location / {
    proxy_pass http://app:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;
  }
}
server {
  listen 8082;
  access_log off;
  location = /stub_status { stub_status; }
  location / { return 404; }
}
